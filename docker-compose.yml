services:
  postgres:
    image: postgres:16-alpine
    container_name: geotrack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geotrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geotrack"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - geotrack_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geotrack_api
    restart: unless-stopped
    environment:
      DATABASE_URL: "host=postgres port=5432 user=postgres password=postgres dbname=geotrack sslmode=disable"
      PORT: "8080"
      # Auth. Set these in your shell or a root-level .env file (git-ignored); nothing secret is
      # stored here. With JWT_SECRET unset the API uses a random per-run secret and warns.
      JWT_SECRET: "${JWT_SECRET:-}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      DEMO_VIEWER_EMAIL: "${DEMO_VIEWER_EMAIL:-}"
      DEMO_VIEWER_PASSWORD: "${DEMO_VIEWER_PASSWORD:-}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173}"
      RETENTION_DAYS: "${RETENTION_DAYS:-7}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - geotrack_net

networks:
  geotrack_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
