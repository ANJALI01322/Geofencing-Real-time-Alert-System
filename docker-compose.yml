services:
  postgres:
    image: postgres:16-alpine
    container_name: geotrack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geotrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geotrack"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - geotrack_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geotrack_api
    restart: unless-stopped
    environment:
      DATABASE_URL: "host=postgres port=5432 user=postgres password=postgres dbname=geotrack sslmode=disable"
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - geotrack_net

networks:
  geotrack_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
